[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outcomeserve"
version = "0.1.0"
description = "Crash-consistent recovery for agentic LLM serving (CMU 11-868 Team 33)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema==4.26.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["outcomeserve*", "workloads*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
